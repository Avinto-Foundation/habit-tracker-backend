# Runs the whole app with one command:
#
#   docker compose up --build
#
# - db:       PostgreSQL 17 (data kept in the "pgdata" volume between restarts)
# - backend:  this Django API          -> http://localhost:8000/api/docs/
# - frontend: the React app            -> http://localhost:5173
#
# The frontend is built from the habit-tracker-frontend repo, which must be
# cloned next to this one:
#
#   Habit_Tracker/
#     habit-tracker-backend/    (this repo, run docker compose here)
#     habit-tracker-frontend/
#
# Settings come from this repo's .env (copy .env.example). Docker Compose also
# uses it to fill in the ${...} values below.

name: habitsquad

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-habit_tracker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on your computer, so it doesn't clash with a local PostgreSQL on 5432.
      # Lets you open the Docker database in pgAdmin/psql if you want to.
      - "5433:5432"
    healthcheck:
      # "Is the database ready to accept connections?" The backend waits for this.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not localhost.
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../habit-tracker-frontend
    env_file:
      # VITE_GOOGLE_CLIENT_ID etc. Optional: without it the app still runs
      # (Google sign-in is simply hidden).
      - path: ../habit-tracker-frontend/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
